settings:
  user_agent: SMEE/0.2 (contacto local; lector RSS respetuoso)
  timeout_seconds: 20
  delay_between_feeds_seconds: 1
  max_feed_bytes: 2000000
  max_items_per_feed: 15
  respect_robots: true
  # Terms that confirm a news item is about Mexican politics.
  # Feeds with require_mexico_context: true must match at least one.
  mexico_context_terms:
    - México
    - mexicano
    - mexicana
    - INE
    - TEPJF
    - gubernatura
    - entidad federativa
    - proceso electoral federal
    - Aguascalientes
    - Baja California
    - Campeche
    - Chiapas
    - Chihuahua
    - Ciudad de México
    - CDMX
    - Coahuila
    - Colima
    - Durango
    - Estado de México
    - Guanajuato
    - Guerrero
    - Hidalgo
    - Jalisco
    - Michoacán
    - Morelos
    - Nayarit
    - Nuevo León
    - Oaxaca
    - Puebla
    - Querétaro
    - Quintana Roo
    - San Luis Potosí
    - Sinaloa
    - Sonora
    - Tabasco
    - Tamaulipas
    - Tlaxcala
    - Veracruz
    - Yucatán
    - Zacatecas

feeds:
  - source_name: Central Electoral INE
    feed_url: https://centralelectoral.ine.mx/feed/
    publication_type: official_release
    filter_scope: all
    max_items: 15
    enabled: true
    include_keywords:
      - elección
      - electoral
      - elecciones
      - gubernatura
      - candidatura
      - tribunal
      - sanción
      - precampaña
  - source_name: El Financiero
    feed_url: https://www.elfinanciero.com.mx/arc/outboundfeeds/rss/?outputType=xml
    publication_type: news
    filter_scope: all
    max_items: 15
    enabled: true
    require_mexico_context: true
    include_keywords:
      - elección
      - electoral
      - elecciones
      - gubernatura
