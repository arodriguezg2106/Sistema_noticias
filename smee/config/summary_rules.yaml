limits:
  minimum_words: 35
  maximum_words: 60

# The monitor is currently scoped to Mexico's 2027 electoral cycle. An explicit
# year or year range in the article always takes precedence over this fallback.
default_electoral_year: "2027"

event_phrases:
  Nueva encuesta: una encuesta de preferencias electorales
  Registro o anuncio de candidatura: un registro o anuncio de candidatura
  Renuncia o declinación: una renuncia o declinación política
  Cambio de candidatura: un cambio de candidatura
  Coalición o alianza: una coalición o alianza electoral
  Ruptura interna: una ruptura interna partidista
  Resolución electoral: una resolución de una autoridad electoral
  Impugnación: una impugnación electoral
  Sanción electoral: una sanción electoral
  Declaración política relevante: una declaración política relacionada con la elección
  Evento de seguridad con impacto político: un hecho de seguridad con impacto electoral
  Programa social relevante: un programa social vinculado con el proceso electoral
  Movimiento partidista: un movimiento partidista
  Nombramiento partidista: un nombramiento partidista
  Inicio o cierre de precampaña: el inicio o cierre de una precampaña
  Publicación oficial de calendario electoral: la publicación de un calendario electoral
  Otro evento electoral: un hecho relacionado con el proceso electoral

# Varied context-sentence templates selected deterministically per summary.
# Placeholders: {event_phrase}, {state}, {parties}, {year}.
context_templates:
  Nueva encuesta:
    - "Esta información se inscribe en {event_phrase} en {state}, involucrando a {parties} en el ciclo {year}."
    - "El hecho se enmarca en {event_phrase} con alcance en {state}, donde figuran {parties}, rumbo a las elecciones de {year}."
  Registro o anuncio de candidatura:
    - "El hecho ocurre en el marco de {event_phrase} en {state}, con la participación de {parties} de cara al proceso de {year}."
    - "Este acontecimiento se relaciona con {event_phrase} en {state}; los actores vinculados son {parties}, en la ruta electoral de {year}."
  Renuncia o declinación:
    - "El suceso se enmarca en {event_phrase} en {state}, con implicaciones para {parties} en el proceso de {year}."
    - "Este hecho corresponde a {event_phrase} en {state}, donde {parties} se ve afectado en el contexto electoral de {year}."
  Coalición o alianza:
    - "El evento se ubica en el contexto de {event_phrase} en {state}, donde participan {parties} de cara al proceso de {year}."
    - "Este movimiento corresponde a {event_phrase} en {state}, involucrando a {parties} en el calendario electoral de {year}."
  Resolución electoral:
    - "La decisión se inscribe en {event_phrase} en {state}, con referencia a {parties} dentro del proceso de {year}."
    - "Este pronunciamiento corresponde a {event_phrase} en {state}, afectando a {parties} en el ciclo electoral de {year}."
  Evento de seguridad con impacto político:
    - "El incidente se relaciona con {event_phrase} en {state}, con implicaciones para {parties} en el contexto electoral de {year}."
    - "Este hecho de seguridad se enmarca en {event_phrase} en {state}, donde {parties} resulta afectado en el proceso de {year}."
  _default:
    - "El hecho se ubica en el contexto de {event_phrase} en {state}, con mención de {parties}, en el proceso electoral de {year}."
    - "Este evento corresponde a {event_phrase} en {state}, donde se identifica a {parties} dentro del calendario electoral de {year}."
    - "La información se inscribe en {event_phrase} en {state}, involucrando a {parties} en el ciclo electoral de {year}."

# Lower values are more prudent. These forms are used only for comparison; the
# generator retains the actual tense found in the source text.
verbs:
  - canonical: decir
    strength: 1
    forms: [dijo, dice, declaró, declara, comentó, comenta, expresó, expresa]
  - canonical: señalar
    strength: 2
    forms: [señaló, señala, indicó, indica, informó, informa, reportó, reporta, mencionó, menciona]
  - canonical: considerar
    strength: 2
    forms: [consideró, considera, estimó, estima, planteó, plantea, prevé]
  - canonical: afirmar
    strength: 3
    forms: [afirmó, afirma, sostuvo, sostiene, aseguró, asegura]
  - canonical: advertir
    strength: 4
    forms: [advirtió, advierte, alertó, alerta, acusó, acusa, denunció, denuncia]
  - canonical: confirmar
    strength: 5
    forms: [confirmó, confirma, garantizó, garantiza, demostró, demuestra]
  - canonical: acción electoral
    strength: 2
    forms: [registró, registra, se registró, se registra, presentó, presenta, solicitó, solicita, aprobó, aprueba, emitió, emite, renunció, renuncia, declinó, declina, reunió, reúne, inició, inicia]

excluded_patterns:
  - "en opinión del autor"
  - "a juicio del autor"
  - "esta columna"
  - "el columnista"
  - "probablemente"
  - "sin duda"
  - "todo indica que"
  - "¿"
  - "?"

future_consequence_patterns:
  - ganará
  - arrasará
  - provocará
  - generará
  - garantizará
  - ocasionará
  - reconfigurará
  - determinará

attribution_forms:
  - dijo
  - declaró
  - señaló
  - indicó
  - afirmó
  - sostuvo
  - aseguró
  - consideró
  - estimó
  - advirtió
  - prevé
