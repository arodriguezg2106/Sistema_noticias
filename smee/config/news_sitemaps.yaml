settings:
  user_agent: SMEE/0.2 (contacto local; lector XML respetuoso)
  timeout_seconds: 20
  delay_between_sitemaps_seconds: 1
  max_feed_bytes: 2000000
  max_items_per_sitemap: 30
  max_age_hours: 48
  respect_robots: true

sitemaps:
  - source_name: El Congresista
    sitemap_url: https://elcongresista.mx/sitemap-news.xml
    max_items: 30
    max_age_hours: 48
    filter_scope: all
    required_path_prefixes:
      - /politica/
    enabled: true
    include_keywords:
      - gubernatura
      - elecciones 2027
      - electoral 2027
      - proceso electoral 2027
      - candidatura
      - candidato a gobernar
      - aspirante al gobierno
      - aspirantes a la gubernatura
      - precampaña
      - encuesta
      - intención de voto
      - coalición electoral
      - alianza electoral
      - alianza morena
      - alianza pri
      - alianza pan
      - renuncia
      - declinación
      - impugnación
      - impugna reforma electoral
      - sanción electoral
      - tribunal electoral
    exclude_keywords:
      - Brasil
      - Lula
      - Trump
      - Biden
      - Venezuela
      - Argentina
      - Colombia
      - Francia
      - Rusia
      - China
  - source_name: El Universal Estados
    sitemap_url: https://www.eluniversal.com.mx/arc/outboundfeeds/sitemap/category/estados/?outputType=xml
    max_items: 40
    max_age_hours: 168
    filter_scope: all
    required_path_prefixes:
      - /estados/
      - /nacion/
      - /politica/
    enabled: true
    include_keywords:
      - gubernatura
      - elecciones
      - electoral
      - candidatura
      - candidato
      - candidata
      - precampaña
      - encuesta
      - intención de voto
      - coalición
      - alianza
      - ventaja
      - consolida
    exclude_keywords:
      - Brasil
      - Lula
      - Trump
      - Biden
      - Venezuela
      - Argentina
      - Colombia
      - Francia
      - Rusia
      - China
  - source_name: El Universal Nación
    sitemap_url: https://www.eluniversal.com.mx/arc/outboundfeeds/sitemap/category/nacion/?outputType=xml
    max_items: 40
    max_age_hours: 168
    filter_scope: all
    required_path_prefixes:
      - /nacion/
      - /politica/
      - /estados/
    enabled: true
    include_keywords:
      - gubernatura
      - elecciones
      - electoral
      - candidatura
      - candidato
      - candidata
      - precampaña
      - encuesta
      - intención de voto
      - coalición
      - alianza
      - ventaja
      - consolida
      - aspirantes
    exclude_keywords:
      - Brasil
      - Lula
      - Trump
      - Biden
      - Venezuela
      - Argentina
      - Colombia
      - Francia
      - Rusia
      - China


